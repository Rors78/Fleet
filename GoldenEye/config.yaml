trading_mode: live   # "paper" or "live" — requires KRAKEN_API_KEY + KRAKEN_API_SECRET env vars

poll_interval_seconds: 2.0
reconciliation_interval_seconds: 300
order_monitor_interval_seconds: 30

use_ensemble_ai: false  # DISABLED: Ollama returns quantized scores (0.42/0.62/0.72) that dampen factor confidence uniformly — no signal, just noise. Re-enable when Ollama is properly calibrated.

auction_theory:
  enabled: true  # Enable volume profile and order block filtering
  min_confluence: 0.4  # Minimum confluence score (0-1) to allow trade
  volume_profile_bins: 20  # Number of bins for volume profile
  order_block_lookback: 10  # Lookback bars for order block detection

subscriber_api:
  enabled: true
  port: 18096  # code hardcodes 18096 at line 3150 — this value is for documentation only

# Subscriber channels (define in subscribers.json):
# - discord: webhook URL
# - telegram: token, chat_id
# - email: smtp_host, smtp_port, username, password, from, to
# - webhook: url
# - custom: url, headers (dict)

# symbols: omitted — bot auto-selects top 20 liquid pairs from CoinGecko + Kraken.
# To pin specific symbols, uncomment and list them:
# symbols:
#   BTC/USD:
#     risk_pct: 0.01
#     sl_pct: 0.01
#     tp_pct: 0.02
